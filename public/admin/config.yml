backend:
  name: github
  repo: fsdearruda/jokenpo-landing-page
  branch: main
  auth_endpoint: oauth
  base_url: https://dashboard.jokenpo.cards
  site_domain: dashboard.jokenpo.cards

local_backend: true
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site
    label: Configurações da landing page
    description: Conteúdo operacional exibido na página principal.
    files:
      - name: site
        label: Informações gerais
        file: src/data/site.json
        format: json
        fields:
          - label: Nome
            name: name
            widget: string
          - label: Nome curto
            name: shortName
            widget: string
          - label: Título da página
            name: title
            widget: string
          - label: Meta description
            name: description
            widget: text
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Primeira linha, name: titleLine1, widget: string }
              - { label: Segunda linha, name: titleLine2, widget: string }
              - { label: Terceira linha, name: titleLine3, widget: string }
              - { label: Descrição, name: description, widget: text }
          - label: Contatos
            name: contact
            widget: object
            fields:
              - { label: Instagram, name: instagram, widget: string }
              - { label: Comunidade WhatsApp, name: communityWhatsapp, widget: string }
              - { label: WhatsApp direto, name: whatsapp, widget: string }
              - { label: E-mail, name: email, widget: string }
              - { label: CNPJ, name: cnpj, widget: string, required: false }
          - label: Localização
            name: location
            widget: object
            fields:
              - { label: Local, name: venue, widget: string }
              - { label: Endereço, name: street, widget: string }
              - { label: Bairro e cidade, name: neighborhood, widget: string }
              - { label: CEP, name: postalCode, widget: string }
              - { label: Link do Maps, name: mapsUrl, widget: string }
              - { label: URL do mapa incorporado, name: embedUrl, widget: string }
          - label: Horários
            name: hours
            widget: list
            fields:
              - { label: Dia exibido, name: day, widget: string }
              - label: Dias para SEO
                name: schemaDays
                widget: list
                field: { label: Dia, name: day, widget: string }
              - { label: Horário exibido, name: open, widget: string }
              - { label: Abertura, name: opens, widget: string, required: false }
              - { label: Fechamento, name: closes, widget: string, required: false }
              - { label: Fechado, name: closed, widget: boolean, required: false, default: false }
          - label: Tabela e Passes de Boardgame
            name: boardgamePasses
            widget: object
            fields:
              - label: Passe da Tarde (Seg, Ter, Qua, Sex)
                name: afternoon
                widget: object
                fields:
                  - { label: Título, name: title, widget: string }
                  - { label: Dias, name: days, widget: string }
                  - { label: Horário, name: hours, widget: string }
                  - { label: Observação, name: note, widget: string }
                  - label: Categorias e Preços
                    name: tiers
                    widget: list
                    fields:
                      - { label: Identificador, name: id, widget: string }
                      - { label: Nome da Categoria, name: name, widget: string }
                      - { label: Preço, name: price, widget: string }
                      - { label: Descrição, name: description, widget: string }
                      - { label: Cor, name: color, widget: select, options: [cyan, yellow, pink] }
                      - { label: Ícone, name: icon, widget: string }
              - label: Dia do Boardgame (Quinta)
                name: thursday
                widget: object
                fields:
                  - { label: Título, name: title, widget: string }
                  - { label: Dias/Horário, name: schedule, widget: string }
                  - { label: Preço, name: price, widget: string }
                  - { label: Observação, name: note, widget: string }
                  - { label: Cor, name: color, widget: select, options: [cyan, yellow, pink] }
              - label: Passe de Sábado
                name: saturday
                widget: object
                fields:
                  - { label: Título, name: title, widget: string }
                  - { label: Dias/Horário, name: schedule, widget: string }
                  - { label: Preço, name: price, widget: string }
                  - { label: Observação, name: note, widget: string }
                  - { label: Cor, name: color, widget: select, options: [cyan, yellow, pink] }
              - label: Pegue e Jogue (Por hora)
                name: hourly
                widget: object
                fields:
                  - { label: Título, name: title, widget: string }
                  - { label: Dias/Horário, name: schedule, widget: string }
                  - { label: Preços por hora (ex. 10 · 13 · 15), name: price, widget: string }
                  - { label: Observação, name: note, widget: string }
                  - { label: Cor, name: color, widget: select, options: [cyan, yellow, pink] }
          - label: Categorias de jogos
            name: boardgameCategories
            widget: list
            fields:
              - { label: Identificador, name: id, widget: string }
              - { label: Nome, name: name, widget: string }
              - { label: Preço, name: price, widget: string }
              - { label: Descrição, name: description, widget: string }
              - { label: Cor, name: color, widget: select, options: [cyan, yellow, pink] }
              - { label: Ícone, name: icon, widget: string }
          - label: Catálogo de Jogos da Loja
            name: boardgames
            widget: list
            summary: "{{fields.name}} ({{fields.categoryName}} - {{fields.price}})"
            fields:
              - { label: Identificador, name: id, widget: string }
              - { label: Nome do Jogo, name: name, widget: string }
              - { label: Categoria, name: category, widget: select, options: [leves, medios, grandes] }
              - { label: Rótulo da Categoria, name: categoryName, widget: string }
              - { label: Preço do Passe, name: price, widget: string }
              - { label: Editora Oficial, name: publisher, widget: string }
              - { label: Tag / Estilo, name: tag, widget: string }
              - { label: Jogadores, name: players, widget: string }
              - { label: Arquivo de Imagem, name: image, widget: string }
          - label: Agenda semanal
            name: agenda
            widget: list
            fields:
              - { label: Dia, name: day, widget: string }
              - { label: Evento, name: name, widget: string }
              - { label: Detalhes, name: detail, widget: string }
              - { label: Cor, name: color, widget: select, options: [cyan, yellow, pink] }
          - label: Cards de serviços
            name: extras
            widget: list
            fields:
              - { label: Número, name: number, widget: string }
              - { label: Título, name: title, widget: string }
              - { label: Descrição, name: description, widget: text }
              - { label: Cor, name: color, widget: select, options: [cyan, yellow, pink] }
          - label: Como Funciona (Passo a Passo)
            name: howItWorks
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Título Linha 1, name: title, widget: string }
              - { label: Título Destaque, name: highlight, widget: string }
              - { label: Texto Introdutório, name: lead, widget: text }
              - label: Passos
                name: steps
                widget: list
                summary: "{{fields.number}} - {{fields.title}}"
                fields:
                  - { label: Número (ex. 01), name: number, widget: string }
                  - { label: Título do Passo, name: title, widget: string }
                  - { label: Descrição, name: description, widget: text }
                  - { label: Cor, name: color, widget: select, options: [cyan, yellow, pink] }
          - label: Perguntas Frequentes (FAQ)
            name: faq
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Pergunta, name: question, widget: string }
              - { label: Resposta, name: answer, widget: text }
