name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pega mudanças de contrato feitas no PDV mesmo sem commit no site
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Segredo não pode ir no `if`; só a informação de que ele existe
      HAS_PDV_TOKEN: ${{ secrets.PDV_CONTRACT_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Versão do pnpm vem do `packageManager` do package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check

      - name: Tests
        run: pnpm test

      # Banco de verdade em memória (PGlite): migrações, pedidos, estoque, faxina e rotas /api
      - name: Integration tests
        run: pnpm test:integracao

      # A cópia do contrato precisa ser igual ao main do PDV (repositório privado: token só de leitura)
      - name: Contract matches PDV
        if: env.HAS_PDV_TOKEN == 'true'
        env:
          PDV_CONTRACT_TOKEN: ${{ secrets.PDV_CONTRACT_TOKEN }}
        run: pnpm sync:contract --remote

      - name: Build
        run: pnpm build
